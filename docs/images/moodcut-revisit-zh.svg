    <rect x="810" y="260" width="590" height="510" rx="15" fill="#faf7fd" stroke="#7451a3" stroke-width="1.8" />
    <text x="1105.0" y="300" text-anchor="middle" font-size="30" font-weight="650" fill="#7451a3">(c) MoodCut</text>
    <path d="M720 195 V230 H205 V260" fill="none" stroke="#64748b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-base)" />
