

name: MoodCut Offline Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline Tests - Python 3.11
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Verify rendering dependencies
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run offline tests
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GOOGLE_API_KEY: ""
        run: |
          python -m pytest -q

      - name: Verify CLI help
        run: |
          python -m moodcut --help

      - name: Verify CLI version
        run: |
          python -m moodcut --version
