name: Video comparison Pages

on:
  push:
    branches: [main, feat/issue-8-agent-animation-pilot, feat/issue-8-actor-v3-live]
    paths:
      - web/video-review/**
      - .github/workflows/video-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-comparison-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Assemble static page and exact historical media
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p _site/media
          cp web/video-review/{index.html,site.css,app.js,data.json,media.sha256} _site/
          gh release download pilot-anna-elsa-20261024 --pattern '*.mp4' --dir _site/media
          gh release download pilot-anna-elsa-v3-20261024 --pattern '*.mp4' --dir _site/media
          cd _site
          sha256sum --check media.sha256
          test "$(find media -maxdepth 1 -name '*.mp4' | wc -l)" -eq 8
          touch .nojekyll
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Deploy comparison page
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
