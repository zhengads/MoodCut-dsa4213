name: Video comparison Pages

on:
  push:
    branches: [main]
    paths:
      - web/video-review/**
      - scripts/build_video_gallery.py
      - docs/studies/six-story-clear-emotions-20261024/release-index.json
      - .github/workflows/video-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-comparison-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Assemble current gallery and verify media
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release-download
          gh release download Videos_01-12 --pattern 'MoodCut_01-12_All_Videos.zip' --dir release-download
          python scripts/build_video_gallery.py --archive release-download/MoodCut_01-12_All_Videos.zip --output _site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Deploy comparison page
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
