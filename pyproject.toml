
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moodcut"
version = "0.0.0"
description = "Emotion-aware storyboard review and constrained revision research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0,<13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["moodcut*"]
namespaces = false

[tool.setuptools.package-data]
moodcut = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
